<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="/images/logo.png" type="image/png">
  <title data-i18n-title="admin.siteTitle">Snow Country Admin</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="/shared/js/tailwind-brand.js"></script>
  <link rel="stylesheet" href="/shared/css/brand.css">
</head>
<body class="bg-ink-50 min-h-screen text-ink-800">
  <div id="toast" class="hidden"></div>

  <!-- Login gate -->
  <div id="loginGate" class="min-h-screen flex items-center justify-center bg-ink-900 p-6">
    <div class="bg-white rounded-2xl shadow-xl p-8 w-full max-w-md border-t-4 border-brand-500">
      <div class="flex justify-between items-start mb-6">
        <div class="flex gap-3 items-start">
          <img src="/images/logo.png" alt="" class="h-12 w-12 object-contain shrink-0">
          <div>
            <h1 class="text-xl font-bold text-ink-900" data-i18n="admin.loginTitle">Staff login</h1>
            <p class="text-sm text-ink-400 mt-1" data-i18n="admin.loginDesc">Enter your Admin API Key to access the dashboard</p>
          </div>
        </div>
        <div id="loginLangSwitcher" class="hidden"></div>
      </div>
      <label class="text-sm font-medium block mb-1.5" data-i18n="admin.apiKey">Admin API Key</label>
      <input id="loginApiKey" type="password" class="w-full border rounded-lg px-3 py-2.5 mb-4 focus:ring-2 focus:ring-brand-500 outline-none">
      <p id="loginError" class="hidden text-sm text-brand-600 mb-3"></p>
      <button id="loginBtn" type="button" class="w-full bg-brand-500 hover:bg-brand-600 text-white font-medium py-2.5 rounded-lg transition" data-i18n="admin.login">Log in</button>
    </div>
  </div>

  <!-- Admin dashboard -->
  <div id="adminApp" class="hidden flex min-h-screen">
    <aside class="w-64 bg-ink-900 text-ink-200 flex flex-col border-r border-brand-500/20">
      <div class="p-6 border-b border-ink-700">
        <div class="flex items-center gap-3">
          <img src="/images/logo.png" alt="" class="h-9 w-9 object-contain">
          <div>
            <h1 class="text-base font-bold text-white">Snow Country</h1>
            <p class="text-xs text-ink-400 mt-0.5" data-i18n="admin.subtitle">Booking management</p>
          </div>
        </div>
      </div>
      <nav class="p-4 space-y-1 flex-1">
        <button data-page="dashboard" data-i18n="admin.nav.dashboard" class="w-full text-left px-4 py-2.5 rounded-lg text-sm hover:bg-ink-800 hover:text-white transition">Dashboard</button>
        <button data-page="bookings" data-i18n="admin.nav.bookings" class="w-full text-left px-4 py-2.5 rounded-lg text-sm hover:bg-ink-800 hover:text-white transition">Bookings</button>
        <button data-page="new-booking" data-i18n="admin.nav.newBooking" class="w-full text-left px-4 py-2.5 rounded-lg text-sm hover:bg-ink-800 hover:text-white transition">New booking</button>
        <button data-page="coaches" data-i18n="admin.nav.coaches" class="w-full text-left px-4 py-2.5 rounded-lg text-sm hover:bg-ink-800 hover:text-white transition">Coaches</button>
        <button data-page="schedule" data-i18n="admin.nav.schedule" class="w-full text-left px-4 py-2.5 rounded-lg text-sm hover:bg-ink-800 hover:text-white transition">Schedule</button>
        <button data-page="head-schedule" data-i18n="admin.nav.headSchedule" class="w-full text-left px-4 py-2.5 rounded-lg text-sm hover:bg-ink-800 hover:text-white transition">Head coaches</button>
        <button data-page="pricing" data-i18n="admin.nav.pricing" class="w-full text-left px-4 py-2.5 rounded-lg text-sm hover:bg-ink-800 hover:text-white transition">Pricing &amp; Resorts</button>
        <button data-page="klook" data-i18n="admin.nav.klook" class="w-full text-left px-4 py-2.5 rounded-lg text-sm hover:bg-ink-800 hover:text-white transition">Klook import</button>
      </nav>
      <div class="p-4 border-t border-ink-700 space-y-2">
        <div id="adminLangSwitcher" class="hidden"></div>
        <button id="logoutBtn" type="button" class="w-full px-3 py-1.5 text-xs text-ink-400 hover:text-brand-400 transition" data-i18n="admin.logout">Log out</button>
      </div>
    </aside>

    <main class="flex-1 p-6 md:p-8 overflow-auto">
      <header class="mb-6 flex justify-between items-start gap-4">
        <div>
          <h2 id="pageTitle" class="text-2xl font-bold text-ink-900">Dashboard</h2>
          <p class="text-sm text-ink-400 mt-1" data-i18n="admin.subtitle">Booking management</p>
        </div>
      </header>
      <div id="content"></div>
    </main>
  </div>

  <script src="/shared/js/locales/en.js"></script>
  <script src="/shared/js/i18n.js"></script>
  <script src="/admin/js/api.js"></script>
  <script src="/admin/js/ui.js"></script>
  <script src="/admin/js/app.js"></script>
</body>
</html>
