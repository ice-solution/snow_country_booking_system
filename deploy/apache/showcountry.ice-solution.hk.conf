# Snow Country Booking System
# Domain: showcountry.ice-solution.hk
# Cloudflare SSL mode: Flexible (HTTPS visitor → Cloudflare → HTTP origin :80)
#
# Install (Ubuntu/Debian):
#   sudo cp deploy/apache/showcountry.ice-solution.hk.conf /etc/apache2/sites-available/
#   sudo a2enmod proxy proxy_http headers rewrite remoteip
#   sudo a2ensite snowcountry.ice-solution.hk.conf
#   sudo apache2ctl configtest && sudo systemctl reload apache2
#
# Ensure the Node app runs on the port below (match PORT in .env), e.g. via systemd/pm2:
#   PORT=3757 npm start

<VirtualHost *:80>
    ServerName snowcountry.ice-solution.hk

    ServerAdmin webmaster@ice-solution.hk
    DocumentRoot /var/www/snowcountry.ice-solution.hk

    ErrorLog ${APACHE_LOG_DIR}/sowcountry.ice-solution.hk-error.log
    CustomLog ${APACHE_LOG_DIR}/snowcountry.ice-solution.hk-access.log combined

    # Real client IP from Cloudflare (optional; requires: a2enmod remoteip)
    RemoteIPHeader CF-Connecting-IP
    RemoteIPTrustedProxy 173.245.48.0/20
    RemoteIPTrustedProxy 103.21.244.0/22
    RemoteIPTrustedProxy 103.22.200.0/22
    RemoteIPTrustedProxy 103.31.4.0/22
    RemoteIPTrustedProxy 141.101.64.0/18
    RemoteIPTrustedProxy 108.162.192.0/18
    RemoteIPTrustedProxy 190.93.240.0/20
    RemoteIPTrustedProxy 188.114.96.0/20
    RemoteIPTrustedProxy 197.234.240.0/22
    RemoteIPTrustedProxy 198.41.128.0/17
    RemoteIPTrustedProxy 162.158.0.0/15
    RemoteIPTrustedProxy 104.16.0.0/13
    RemoteIPTrustedProxy 104.24.0.0/14
    RemoteIPTrustedProxy 172.64.0.0/13
    RemoteIPTrustedProxy 131.0.72.0/22

    ProxyPreserveHost On
    ProxyRequests Off
    ProxyAddHeaders On

    # Flexible SSL: browser is HTTPS; origin is HTTP. Cloudflare usually sends this header.
    RequestHeader set X-Forwarded-Proto "https" "expr=%{HTTP:CF-Visitor} =~ /https/i"

    # Change 3757 if your .env PORT differs
    ProxyPass / http://127.0.0.1:3757/ connectiontimeout=5 timeout=300
    ProxyPassReverse / http://127.0.0.1:3757/

    # Block direct origin access without going through Cloudflare (recommended)
    <Location />
        Require all granted
        # Uncomment to allow only Cloudflare IPs (stricter):
        # Require ip 173.245.48.0/20 103.21.244.0/22 103.22.200.0/22 103.31.4.0/22
        # Require ip 141.101.64.0/18 108.162.192.0/18 190.93.240.0/20 188.114.96.0/20
        # Require ip 197.234.240.0/22 198.41.128.0/17 162.158.0.0/15 104.16.0.0/13
        # Require ip 104.24.0.0/14 172.64.0.0/13 131.0.72.0/22
    </Location>

    Header always set X-Content-Type-Options "nosniff"
    Header always set X-Frame-Options "SAMEORIGIN"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"
</VirtualHost>
