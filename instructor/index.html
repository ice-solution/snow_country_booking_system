<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="/images/logo.png" type="image/png">
  <title data-i18n-title="instructor.title">導師課表 - Snow Country</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="/shared/js/tailwind-brand.js"></script>
  <link rel="stylesheet" href="/shared/css/brand.css">
</head>
<body class="bg-ink-50 min-h-screen">
  <div id="loginGate" class="min-h-screen flex items-center justify-center p-4">
    <div class="bg-white border border-ink-100 rounded-xl p-6 w-full max-w-sm shadow-sm">
      <div class="flex items-center gap-3 mb-4">
        <img src="/images/logo.png" alt="" class="h-10 w-10 object-contain">
        <h1 class="text-lg font-bold" data-i18n="instructor.loginTitle">導師登入</h1>
      </div>
      <form id="loginForm" class="space-y-3">
        <label class="text-sm block">
          <span data-i18n="instructor.loginField">電郵或電話</span>
          <input type="text" name="login" required autocomplete="username" class="mt-1 w-full border rounded-lg px-3 py-2 text-sm">
        </label>
        <label class="text-sm block">
          <span data-i18n="instructor.pin">PIN 密碼</span>
          <input type="password" name="pin" required minlength="4" autocomplete="current-password" class="mt-1 w-full border rounded-lg px-3 py-2 text-sm">
        </label>
        <button type="submit" class="w-full px-4 py-2 bg-brand-500 hover:bg-brand-600 text-white rounded-lg text-sm" data-i18n="instructor.loginBtn">登入</button>
      </form>
      <p id="loginError" class="text-sm text-red-600 mt-2 hidden"></p>
      <div id="langSwitcher" class="mt-4 flex justify-end"></div>
    </div>
  </div>

  <div id="appShell" class="hidden">
    <header class="bg-ink-900 text-white px-4 py-4 flex justify-between items-start gap-4 border-b border-brand-500/30">
      <div class="flex items-center gap-3">
        <img src="/images/logo.png" alt="" class="h-9 w-9 object-contain">
        <div>
          <h1 class="text-lg font-bold" data-i18n="instructor.title">Snow Country 導師課表</h1>
          <p id="instructorName" class="text-sm text-ink-300 mt-0.5" data-i18n="common.loading">載入中...</p>
        </div>
      </div>
      <div class="flex items-center gap-2">
        <a href="/instructor/profile.html" class="text-xs px-3 py-1.5 rounded-lg bg-ink-800 hover:bg-ink-700" data-i18n="instructor.profile">個人資料</a>
        <div id="langSwitcherHeader" class="flex gap-1 bg-ink-800 rounded-lg p-0.5"></div>
        <button id="logoutBtn" class="text-xs px-3 py-1.5 rounded-lg bg-ink-800 hover:bg-ink-700" data-i18n="instructor.logout">登出</button>
      </div>
    </header>

    <main class="max-w-5xl mx-auto p-4 space-y-4">
      <div class="flex flex-wrap gap-3 items-center bg-white rounded-xl border border-ink-100 p-4">
        <label class="text-sm"><span data-i18n="instructor.date">日期</span>
          <input type="date" id="dateInput" class="ml-2 border rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-brand-500 outline-none">
        </label>
        <button id="refreshBtn" class="px-4 py-2 bg-brand-500 hover:bg-brand-600 text-white rounded-lg text-sm transition" data-i18n="common.refresh">重新整理</button>
      </div>

      <div id="legend" class="flex flex-wrap gap-2 text-xs"></div>
      <div id="gantt" class="bg-white rounded-xl border border-ink-100 overflow-x-auto"></div>
      <div id="upcoming" class="bg-white rounded-xl border border-ink-100 p-4"></div>

      <div class="bg-white rounded-xl border border-ink-100 p-4">
        <h2 class="font-semibold mb-3" data-i18n="instructor.leaveRequest">申請請假</h2>
        <form id="leaveForm" class="grid sm:grid-cols-2 gap-3">
          <label class="text-sm block">
            <span data-i18n="instructor.leaveDate">請假日期</span>
            <input type="date" name="leaveDate" required class="mt-1 w-full border rounded-lg px-3 py-2 text-sm">
          </label>
          <fieldset class="text-sm sm:col-span-2">
            <legend class="mb-1" data-i18n="admin.leavePeriod">請假時段</legend>
            <label class="mr-4"><input type="radio" name="leavePeriod" value="full" checked> <span data-i18n="admin.leaveFullDay">全日</span></label>
            <label class="mr-4"><input type="radio" name="leavePeriod" value="half_am"> <span data-i18n="admin.leaveHalfAm">上午 (09:00–12:00)</span></label>
            <label><input type="radio" name="leavePeriod" value="half_pm"> <span data-i18n="admin.leaveHalfPm">下午 (13:00–16:00)</span></label>
          </fieldset>
          <label class="text-sm block sm:col-span-2">
            <span data-i18n="instructor.leaveReason">原因</span>
            <input type="text" name="leaveReason" class="mt-1 w-full border rounded-lg px-3 py-2 text-sm">
          </label>
          <button type="submit" class="sm:col-span-2 px-4 py-2 bg-amber-500 hover:bg-amber-600 text-white rounded-lg text-sm w-fit" data-i18n="instructor.submitLeave">提交申請</button>
        </form>
        <p id="leaveMsg" class="text-sm mt-2 hidden"></p>
      </div>

      <div id="dayOverview" class="bg-white rounded-xl border border-ink-100 p-4 overflow-x-auto">
        <h2 class="font-semibold mb-3" data-i18n="instructor.allInstructorsDay">當日全部導師課堂</h2>
        <div id="dayOverviewBody"><p class="text-slate-500 text-sm" data-i18n="common.loading">載入中...</p></div>
      </div>
    </main>
  </div>

  <script src="/shared/js/locales/zh.js"></script>
  <script src="/shared/js/locales/en.js"></script>
  <script src="/shared/js/i18n.js"></script>
  <script src="/instructor/js/app.js"></script>
</body>
</html>
